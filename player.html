<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة 7STAR</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* الهيدر العلوي */
        .header {
            background: #1e293b;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            object-fit: cover;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 700;
            font-size: 13px;
            color: #38bdf8;
        }

        .user-id {
            font-size: 10px;
            color: #94a3b8;
        }

        .action-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 5px 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            transition: all 0.3s ease;
            color: #fff;
        }

        .btn-lang { background: #8b5cf6; }
        .btn-deposit { background: #10b981; }
        .btn-withdraw { background: #ef4444; }
        .btn-logout { background: #64748b; }

        /* منطقة اللعب */
        .game-area {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo-container {
            text-align: center;
            width: 100%;
            max-width: 220px;
        }

        .game-logo {
            width: 100%;       
            max-height: 110px;
            object-fit: contain; 
            border-radius: 12px;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); 
        }

        /* شاشة اللعب (العداد) */
        .game-screen {
            width: 100%;
            max-width: 400px;
            height: 100px;
            background: #1e293b;
            border-radius: 12px;
            border: 2px dashed #475569;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }

        .digital-timer {
            font-family: 'Courier New', Courier, monospace;
            font-size: 50px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
        }

        /* الأزرار الثمانية */
        .game-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 600px;
        }

        .game-btn {
            background: #ef4444; /* أحمر */
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 70px;
        }

        .game-btn.active {
            background: #10b981; /* أخضر */
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .game-btn .btn-number {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
        }

        .game-btn .btn-price {
            font-size: 12px;
            font-weight: 700;
            color: #ffe4e6;
            margin-top: 2px;
        }

        /* زر البدء */
        .btn-start {
            font-size: 18px;
            padding: 12px 60px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="user-info">
            <img src="https://i.postimg.cc/rspqjjdL/1794453331407.jpg" alt="Avatar" class="user-avatar">
            <div class="user-details">
                <span class="user-name" id="userName">اسم اللاعب</span>
                <span class="user-id" id="userId">ID: 123456</span>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-lang">EN</button>
            <button class="btn btn-deposit">إيداع</button>
            <button class="btn btn-withdraw">سحب</button>
            <button class="btn btn-logout">خروج</button>
        </div>
    </header>

    <main class="game-area">
        
        <div class="logo-container">
            <img src="https://i.postimg.cc/rspqjjdL/1794453331407.jpg" alt="7STAR Logo" class="game-logo">
        </div>

        <!-- شاشة اللعب والعداد -->
        <div class="game-screen">
            <div class="digital-timer" id="timerDisplay">25</div>
        </div>

        <!-- الأزرار الثمانية مع الأسعار الثابتة -->
        <div class="game-buttons-grid" id="gameButtonsGrid">
            <!-- data-price هو السعر الثابت للزر -->
            <div class="game-btn" data-index="1" data-price="10"><div class="btn-number">1</div><div class="btn-price">10</div></div>
            <div class="game-btn" data-index="2" data-price="20"><div class="btn-number">2</div><div class="btn-price">20</div></div>
            <div class="game-btn" data-index="3" data-price="30"><div class="btn-number">3</div><div class="btn-price">30</div></div>
            <div class="game-btn" data-index="4" data-price="50"><div class="btn-number">4</div><div class="btn-price">50</div></div>
            <div class="game-btn" data-index="5" data-price="100"><div class="btn-number">5</div><div class="btn-price">100</div></div>
            <div class="game-btn" data-index="6" data-price="200"><div class="btn-number">6</div><div class="btn-price">200</div></div>
            <div class="game-btn" data-index="7" data-price="500"><div class="btn-number">7</div><div class="btn-price">500</div></div>
            <div class="game-btn" data-index="8" data-price="1000"><div class="btn-number">8</div><div class="btn-price">1000</div></div>
        </div>

        <!-- زر البدء -->
        <button class="btn-start" id="startBtn">START</button>

    </main>

    <!-- الجافاسكريبت -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAp-tMO1n8SwnnWr1nXGIWpckALact9UYc",
            authDomain: "maze-game-7.firebaseapp.com",
            databaseURL: "https://maze-game-7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "maze-game-7",
            storageBucket: "maze-game-7.firebasestorage.app",
            messagingSenderId: "948688357452",
            appId: "1:948688357452:web:4f21a537c6d7dfc9244ce9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const GAME = {
            GAME_CUT: 0.25,
            POOL_SHARE: 0.75,
            MULTIPLIER: 2,
            ROUND_SECONDS: 25,
        };

        // اللاعب التجريبي (سنستبدله لاحقاً بنظام تسجيل الدخول)
        let currentUser = { id: "TEST123", name: "لاعب تجريبي", balance: 2000 };
        
        let currentBets = {}; // لحفظ الرهانات { "1": 10, "4": 50 }
        let timerInterval = null;
        let currentTime = GAME.ROUND_SECONDS;
        let isRoundActive = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const gameButtons = document.querySelectorAll('.game-btn');
        const startBtn = document.getElementById('startBtn');
        const userNameDisplay = document.getElementById('userName');
        const userIdDisplay = document.getElementById('userId');

        // عرض بيانات اللاعب
        userNameDisplay.innerText = currentUser.name;
        userIdDisplay.innerText = "ID: " + currentUser.id;

        function updateTimerDisplay(seconds) {
            timerDisplay.innerText = seconds;
            timerDisplay.style.color = (seconds <= 10 && isRoundActive) ? '#ef4444' : '#38bdf8';
        }

        function resetBets() {
            gameButtons.forEach(btn => {
                btn.classList.remove('active');
            });
            currentBets = {};
            startBtn.innerText = "START";
            startBtn.disabled = false;
        }

        // 1. التفاعل مع الأزرار (وضع الرهان)
        gameButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isRoundActive) {
                    alert("انتظر بدء الجولة القادمة!");
                    return;
                }

                const index = btn.getAttribute('data-index');
                const price = parseInt(btn.getAttribute('data-price'));

                // إذا كان الزر مضغوطاً بالفعل، قم بإلغاء الرهان
                if (currentBets[index]) {
                    delete currentBets[index];
                    btn.classList.remove('active');
                } else {
                    // التحقق من الرصيد
                    if (currentUser.balance < price) {
                        alert("رصيدك غير كافٍ!");
                        return;
                    }
                    
                    // خصم الرصيد وإضافة الرهان
                    currentUser.balance -= price;
                    currentBets[index] = price;
                    btn.classList.add('active');
                }
            });
        });

        // 2. بدء الجولة
        function startNewRound() {
            isRoundActive = true;
            currentTime = GAME.ROUND_SECONDS;
            resetBets();
            updateTimerDisplay(currentTime);
            
            startBtn.innerText = "جاري اللعب...";
            startBtn.disabled = true;

            timerInterval = setInterval(() => {
                currentTime--;
                updateTimerDisplay(currentTime);

                // عند الوصول لـ 10 ثواني (إعلان النتائج)
                if (currentTime === 10) {
                    executeGameResult();
                }

                // عند انتهاء الجولة
                if (currentTime <= 0) {
                    clearInterval(timerInterval);
                    isRoundActive = false;
                    // الانتقال للجولة التالية تلقائياً بعد ثانيتين
                    setTimeout(() => { startNewRound(); }, 2000);
                }
            }, 1000);
        }

        // زر البدء (إذا ضغط اللاعب START، يقفل الجولة فوراً لبدء الحساب)
        startBtn.addEventListener('click', () => {
            if (isRoundActive && Object.keys(currentBets).length > 0) {
                // إذا كان هناك رهانات، نسرع العداد ليقفز للنتائج
                currentTime = 11; 
            }
        });

        // 3. حساب النتائج عبر Firebase
        async function executeGameResult() {
            const selectedButtons = Object.keys(currentBets);
            
            // إذا لم يضع اللاعب أي رهان، لا نفعل شيئاً
            if (selectedButtons.length === 0) return; 

            const totalBet = Object.values(currentBets).reduce((a, b) => a + b, 0);

            try {
                const poolRef = ref(db, 'pool/balance');
                const poolSnap = await get(poolRef);
                let currentPool = poolSnap.exists() ? poolSnap.val() : 0;

                // 1. توزيع الأرباح (25% للعبة، 75% للصندوق)
                const gameCut = totalBet * GAME.GAME_CUT;
                const poolShare = totalBet * GAME.POOL_SHARE;
                let newPoolBalance = currentPool + poolShare;
                
                // تحديث أرباح اللعبة في فايربيس
                await update(ref(db, 'admin_stats'), { totalGameProfit: gameCut });

                // 2. تحديد الفائز
                let winningButton = null;
                
                // نختار زر عشوائي من الأزرار التي راهن عليها اللاعب
                const randomSelectedIndex = selectedButtons[Math.floor(Math.random() * selectedButtons.length)];
                const potentialWin = currentBets[randomSelectedIndex] * GAME.MULTIPLIER;

                // 3. التحقق من الصندوق (هل يكفي لدفع الجائزة؟)
                if (newPoolBalance >= potentialWin) {
                    winningButton = parseInt(randomSelectedIndex);
                    newPoolBalance -= potentialWin;
                    currentUser.balance += potentialWin; // إعادة المكسب للرصيد
                    alert(`🎉 مبروك! الزر ${winningButton} فاز. ربحت ${potentialWin} ماسة.`);
                } else {
                    // الصندوق لا يكفي -> النظام يختار زر لم يختره اللاعب
                    winningButton = Math.floor(Math.random() * 8) + 1;
                    while (selectedButtons.includes(winningButton.toString())) {
                        winningButton = Math.floor(Math.random() * 8) + 1;
                    }
                    alert(`❌ للأسف، الزر الفائز هو ${winningButton}. خسرت رهانك.`);
                }

                // تحديث رصيد الصندوق في Firebase
                await update(ref(db, 'pool'), { balance: newPoolBalance });

                // إظهار الزر الفائز (تأثير ذهبي)
                gameButtons.forEach(btn => {
                    if (parseInt(btn.getAttribute('data-index')) === winningButton) {
                        btn.style.boxShadow = "0 0 30px #fbbf24";
                        btn.style.transform = "scale(1.1)";
                        btn.style.zIndex = "10";
                    } else {
                        btn.style.boxShadow = "none";
                        btn.style.transform = "scale(1)";
                        btn.style.zIndex = "1";
                    }
                });

            } catch (error) {
                console.error("خطأ في تنفيذ نتيجة الجولة:", error);
            }
        }

        // بدء اللعبة تلقائياً عند فتح الصفحة
        document.addEventListener("DOMContentLoaded", () => {
            startNewRound();
        });
    </script>
</body>
</html>
